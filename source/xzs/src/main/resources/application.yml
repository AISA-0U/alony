server:
  port: 8000
  undertow:
    io-threads: 16
    worker-threads: 4000
    buffer-size: 1024
    direct-buffers: true
  compression:
    enabled: true
    min-response-size: 1

#logging logback
logging:
  config: classpath:logback-spring.xml
  file: xzs

#mybatis
mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    log-prefix: repository.


system:
  security-ignore-urls:
    - /api/wx/**
    - /api/admin/upload/configAndUpload
    - /api/admin/upload/auth
    - /api/student/user/register
  pwdKey:
    publicKey: ${XZS_RSA_PUBLIC_KEY:}
    privateKey: ${XZS_RSA_PRIVATE_KEY:}
  wx:
    appid: ${XZS_WX_APP_ID:}
    secret: ${XZS_WX_SECRET:}
    token-to-live: 12h   #token 过期时间
    security-ignore-urls:
      - /api/wx/student/auth/bind
      - /api/wx/student/auth/checkBind
      - /api/wx/student/user/register
  qn:
    url: ${XZS_QINIU_URL:}
    bucket: ${XZS_QINIU_BUCKET:}
    access-key: ${XZS_QINIU_ACCESS_KEY:}
    secret-key: ${XZS_QINIU_SECRET_KEY:}


#mybatis page helper
pagehelper:
  autoDialect: true
  closeConn: true
  reasonable: true


#mybatis datasource default HikariPool
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    hikari:
      idle-timeout: 600000  #10 min
      max-lifetime: 1800000 #30 min


  #runningtime environment
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
